[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srcloc_env"
version = "0.1.0"
description = "Multi-drone radiological source-term estimation on high-fidelity LBM/LDM urban dispersion data: sensor model, Rao-Blackwellised particle filter, GMM belief summary and multi-agent RL environment"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "jh_lee" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "vtk>=9.3",
  "scikit-learn>=1.5",
  "gymnasium>=1.0",
  "matplotlib>=3.9",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["pyvista>=0.44", "imageio[ffmpeg]>=2.34"]     # scripts/render_episode_3d.py (3-D episode video)

[tool.setuptools.packages.find]
include = ["srcloc_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
